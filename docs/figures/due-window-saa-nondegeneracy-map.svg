<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f4f7f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#35546d"/>
    </marker>
    <style>
      .title { font: 700 38px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17324d; }
      .subtitle { font: 500 20px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#557086; }
      .head { font: 700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17324d; }
      .body { font: 500 20px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#263f52; }
      .small { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#4c667a; }
      .formula { font: italic 22px Georgia,'Times New Roman',serif; fill:#17324d; }
      .box { fill:#ffffff; stroke:#b7c9d8; stroke-width:2; rx:18; filter:url(#shadow); }
      .danger { fill:#fff4f2; stroke:#d86a58; stroke-width:2.5; rx:18; }
      .warn { fill:#fff9e9; stroke:#d6a740; stroke-width:2.5; rx:18; }
      .good { fill:#eef8f0; stroke:#4c9a62; stroke-width:2.5; rx:18; }
      .blue { fill:#eef5ff; stroke:#4c78ad; stroke-width:2.5; rx:18; }
      .line { stroke:#35546d; stroke-width:3; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="940" fill="url(#bg)"/>
  <text x="800" y="58" text-anchor="middle" class="title">决策型 due window：什么时候退化，什么时候仍需联合 SAA</text>
  <text x="800" y="92" text-anchor="middle" class="subtitle">窗口宽度与窗口位置是两个独立自由度；两者都被控制，并不自动保证双侧 ET，但能排除结构性退化</text>

  <rect x="565" y="128" width="470" height="150" class="box"/>
  <text x="800" y="167" text-anchor="middle" class="head">共同窗口 [a<tspan baseline-shift="sub" font-size="17">j</tspan>, b<tspan baseline-shift="sub" font-size="17">j</tspan>]</text>
  <line x1="665" y1="220" x2="935" y2="220" stroke="#1f5c99" stroke-width="7"/>
  <line x1="665" y1="202" x2="665" y2="238" stroke="#1f5c99" stroke-width="7"/>
  <line x1="935" y1="202" x2="935" y2="238" stroke="#1f5c99" stroke-width="7"/>
  <text x="665" y="263" text-anchor="middle" class="formula">a<tspan baseline-shift="sub" font-size="16">j</tspan></text>
  <text x="935" y="263" text-anchor="middle" class="formula">b<tspan baseline-shift="sub" font-size="16">j</tspan></text>
  <text x="800" y="199" text-anchor="middle" class="small">宽度 b−a</text>

  <rect x="70" y="128" width="390" height="150" class="blue"/>
  <text x="265" y="167" text-anchor="middle" class="head">方向一：扩张窗口</text>
  <text x="265" y="205" text-anchor="middle" class="body">固定 a，只增加 b</text>
  <text x="265" y="239" text-anchor="middle" class="small">控制：正宽度成本 / 固定宽度 / 最大宽度</text>
  <path d="M460 203 L550 203" class="line"/>

  <rect x="1140" y="128" width="390" height="150" class="blue"/>
  <text x="1335" y="167" text-anchor="middle" class="head">方向二：整体后移</text>
  <text x="1335" y="205" text-anchor="middle" class="body">a、b 与执行时间同时增加 Δ</text>
  <text x="1335" y="239" text-anchor="middle" class="small">锚：位置成本 / 真范围 / overtime / 付费等待</text>
  <path d="M1140 203 L1050 203" class="line"/>

  <rect x="70" y="342" width="430" height="205" class="danger"/>
  <text x="285" y="383" text-anchor="middle" class="head">没有宽度控制</text>
  <text x="285" y="425" text-anchor="middle" class="formula">[a,b] = [0,M]</text>
  <text x="285" y="462" text-anchor="middle" class="body">覆盖全部场景完成时刻</text>
  <text x="285" y="497" text-anchor="middle" class="body">ET = 0，且无需额外等待</text>
  <text x="285" y="526" text-anchor="middle" class="small">整体问题也许仍有 overtime，但窗口决策已失去作用</text>

  <rect x="585" y="342" width="430" height="205" class="danger"/>
  <text x="800" y="383" text-anchor="middle" class="head">没有位置锚 + 免费自适应等待</text>
  <text x="800" y="425" text-anchor="middle" class="body">沿每台机器序列递归设置足够晚的点窗口</text>
  <text x="800" y="462" text-anchor="middle" class="formula">a<tspan baseline-shift="sub" font-size="16">j</tspan> = b<tspan baseline-shift="sub" font-size="16">j</tspan> = d<tspan baseline-shift="sub" font-size="16">j</tspan></text>
  <text x="800" y="497" text-anchor="middle" class="body">所有场景等待到 d：ET = 0，宽度 = 0</text>
  <text x="800" y="526" text-anchor="middle" class="small">TWA 只剩 routing；纯调度可能只剩基础排程成本</text>

  <rect x="1100" y="342" width="430" height="205" class="warn"/>
  <text x="1315" y="383" text-anchor="middle" class="head">只有范围约束</text>
  <text x="1315" y="425" text-anchor="middle" class="formula">L<tspan baseline-shift="sub" font-size="16">j</tspan> ≤ a<tspan baseline-shift="sub" font-size="16">j</tspan> ≤ b<tspan baseline-shift="sub" font-size="16">j</tspan> ≤ U<tspan baseline-shift="sub" font-size="16">j</tspan></text>
  <text x="1315" y="462" text-anchor="middle" class="body">只负责截断整体后移</text>
  <text x="1315" y="497" text-anchor="middle" class="body">[U,U] 只是隔离任务下的边界倾向</text>
  <text x="1315" y="526" text-anchor="middle" class="small">完整序列有下游冲突时，不是全局定理</text>

  <path d="M285 547 L285 625 L615 625" class="line"/>
  <path d="M800 547 L800 625" class="line"/>
  <path d="M1315 547 L1315 625 L985 625" class="line"/>

  <rect x="330" y="645" width="940" height="185" class="good"/>
  <text x="800" y="688" text-anchor="middle" class="head">非退化且一般仍需联合 SAA 的结构</text>
  <text x="800" y="728" text-anchor="middle" class="body">① 宽度受控　② 位置有锚　③ 多个非同质场景共享同一窗口</text>
  <text x="800" y="765" text-anchor="middle" class="body">④ 场景内等待可决策并向后传播　⑤ 成本系数不处于端点支配区间</text>
  <text x="800" y="804" text-anchor="middle" class="small">此时窗口可在数学上投影成值函数，但固定排程仍不确定全部场景完成时刻，不能化成确定性的一元完工时间函数</text>

  <rect x="180" y="862" width="1240" height="50" fill="#edf1f4" stroke="#bdc9d2" stroke-width="1.5" rx="12"/>
  <text x="800" y="894" text-anchor="middle" class="small">initial idle 只有在“付费等待是唯一位置锚且首任务可以自由延迟”时才需要同价计费；固定首任务从 release time 开始同样可以消除平移自由</text>
</svg>
